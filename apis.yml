aid: quera
name: QuEra Computing
description: >-
  QuEra Computing is a Boston-area neutral-atom quantum computing company,
  founded in 2021 by scientists from Harvard and MIT. Its flagship system,
  Aquila, is a 256-qubit field-programmable analog neutral-atom quantum
  processor that has been publicly available since November 2022 through
  Amazon Braket and through a direct Premium Access channel. QuEra develops
  Bloqade, an open-source software stack for neutral-atom quantum computing
  delivered as a Python SDK (Bloqade Python) and as the original Bloqade.jl
  Julia package, along with surrounding tooling for circuits, analog control,
  atom shuttling, decoders, and tensor-network simulation. The company is
  building toward fault-tolerant quantum computing with its Gemini-class
  next-generation systems and has demonstrated logical-level magic state
  distillation on neutral-atom hardware. QuEra works with HPC centers,
  national labs (NERSC, Los Alamos), DARPA, NEDO/AIST, NVIDIA, AWS, BCG X,
  Deloitte, Classiq, Kipu Quantum, Wolfram Research, and enterprise
  customers including BP, BASF, Merck, and Amgen. The system is consumed
  via the Bloqade SDK or AWS Braket; QuEra does not currently expose a
  public REST API to its QPU.
